{% extends "base.html" %}

{% block title %}User Login - FitAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-custom p-4 bg-white shadow-xs">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="width: 40px; height: 40px; font-size: 1.25rem;">
                        <i class="bi bi-person"></i>
                    </div>
                    <h1 class="fs-5 fw-bold mb-1">User Login</h1>
                    <p class="text-muted small mb-0">Sign in to your personal fitness workspace</p>
                </div>

                <form method="POST" action="{{ url_for('auth.user_login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                        Sign In
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <p class="small text-muted mb-1">
                        Don't have an account? <a href="{{ url_for('auth.user_register') }}" class="fw-medium text-primary">Register</a>
                    </p>
                    <p class="small text-muted mb-0">
                        Gym trainer? <a href="{{ url_for('auth.trainer_login') }}" class="fw-medium text-secondary">Trainer Login &rarr;</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
