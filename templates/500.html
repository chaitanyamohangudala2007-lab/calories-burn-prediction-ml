{% extends "base.html" %}

{% block title %}Server Error (500) - FitAI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-custom p-4 p-md-5 mx-auto bg-white" style="max-width: 480px;">
        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem; background-color: #fef2f2; border-color: #fecaca; color: #dc2626;">
            <i class="bi bi-gear-wide-connected"></i>
        </div>
        <div class="fs-1 fw-bold text-dark mb-1">500</div>
        <h1 class="fs-5 fw-bold mb-2">Internal Server Error</h1>
        <p class="text-muted small mb-4">
            An unexpected error occurred. Please verify MySQL service and database credentials in your .env file.
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-outline-custom">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
